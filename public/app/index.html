<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Management System</title>
<!--
  This used to be a role-picker prototype that wrote {role, name} straight
  into localStorage -- anyone could grant themselves Administrator from the
  browser console. That has been replaced with a real Laravel session
  login at /login (see fms-backend/resources/views/auth/login.blade.php
  and Auth\LoginController). This page now only exists so a bookmark or
  stray link to /app/index.html still lands somewhere sensible instead of
  a 404.
-->
<meta http-equiv="refresh" content="0; url=/login">
<script>window.location.replace('/login');</script>
</head>
<body>
  <p>Redirecting to sign in&hellip; if this does not happen automatically, <a href="/login">click here</a>.</p>
</body>
</html>
